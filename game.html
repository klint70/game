<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz Game with Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5faff;
      padding: 30px;
      display: flex;
      justify-content: center;
    }
    .quiz-container {
      background: #fff;
      padding: 20px 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 600px;
      width: 100%;
    }
    h2 {
      margin-bottom: 15px;
    }
    .option {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      background: #eee;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: left;
    }
    .option:hover {
      background-color: #cde5ff;
    }
    .option.correct {
      background-color: #a4edb7;
    }
    .option.wrong {
      background-color: #f7a4a4;
    }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    #timer {
      font-size: 18px;
      margin-bottom: 10px;
      color: #ff0000;
      font-weight: bold;
    }
    .result {
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <div id="timer">Time Left: 15s</div>
  <h2 id="question">Question</h2>
  <div id="options"></div>
  <button class="btn" onclick="nextQuestion()">Next</button>
  <div class="result" id="result"></div>
</div>

<script>
const quizData = [
  {
    question: "What is the capital of France?",
    options: ["Berlin", "Paris", "Madrid", "Lisbon"],
    answer: "Paris"
  },
  {
    question: "Who wrote 'Hamlet'?",
    options: ["William Shakespeare", "Leo Tolstoy", "Jane Austen", "Mark Twain"],
    answer: "William Shakespeare"
  },
  {
    question: "Largest planet in our Solar System?",
    options: ["Earth", "Saturn", "Mars", "Jupiter"],
    answer: "Jupiter"
  },
  {
    question: "Language used for web apps?",
    options: ["C++", "Python", "Java", "JavaScript"],
    answer: "JavaScript"
  },
  {
    question: "How many continents on Earth?",
    options: ["5", "6", "7", "8"],
    answer: "7"
  },
  {
    question: "Gas absorbed by plants?",
    options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"],
    answer: "Carbon Dioxide"
  },
  {
    question: "9 x 9 = ?",
    options: ["81", "99", "72", "90"],
    answer: "81"
  },
  {
    question: "Fastest land animal?",
    options: ["Tiger", "Horse", "Cheetah", "Lion"],
    answer: "Cheetah"
  },
  {
    question: "Sun rises from?",
    options: ["West", "East", "North", "South"],
    answer: "East"
  },
  {
    question: "Water boils at?",
    options: ["100°C", "80°C", "90°C", "110°C"],
    answer: "100°C"
  }
];

let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 15;
let answered = false;

function startTimer() {
  timeLeft = 15;
  document.getElementById("timer").innerText = `Time Left: ${timeLeft}s`;
  timer = setInterval(() => {
    timeLeft--;
    document.getElementById("timer").innerText = `Time Left: ${timeLeft}s`;
    if (timeLeft <= 0) {
      clearInterval(timer);
      if (!answered) {
        showCorrectAnswer();
      }
    }
  }, 1000);
}

function loadQuestion() {
  const q = quizData[currentQuestion];
  document.getElementById("question").innerText = `${currentQuestion + 1}. ${q.question}`;
  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";
  document.getElementById("result").innerText = "";
  answered = false;

  q.options.forEach(option => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.innerText = option;
    btn.onclick = () => checkAnswer(btn, option);
    optionsContainer.appendChild(btn);
  });

  clearInterval(timer);
  startTimer();
}

function checkAnswer(btn, selectedOption) {
  if (answered) return;
  answered = true;
  clearInterval(timer);
  const correctAnswer = quizData[currentQuestion].answer;

  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => {
    b.disabled = true;
    if (b.innerText === correctAnswer) b.classList.add("correct");
    if (b.innerText === selectedOption && selectedOption !== correctAnswer) {
      b.classList.add("wrong");
    }
  });

  if (selectedOption === correctAnswer) {
    score++;
    document.getElementById("result").innerText = "Correct!";
  } else {
    document.getElementById("result").innerText = `Wrong! Correct answer: ${correctAnswer}`;
  }
}

function showCorrectAnswer() {
  answered = true;
  const correctAnswer = quizData[currentQuestion].answer;
  const buttons = document.querySelectorAll(".option");
  buttons.forEach(b => {
    b.disabled = true;
    if (b.innerText === correctAnswer) {
      b.classList.add("correct");
    }
  });
  document.getElementById("result").innerText = `Time's up! Correct answer: ${correctAnswer}`;
}

function nextQuestion() {
  if (currentQuestion < quizData.length - 1) {
    currentQuestion++;
    loadQuestion();
  } else {
    showFinalResult();
  }
}

function showFinalResult() {
  clearInterval(timer);
  const container = document.querySelector(".quiz-container");
  container.innerHTML = `
    <h2>🏆 Quiz Completed!</h2>
    <p class="result">Your Score: ${score} / ${quizData.length}</p>
    <p class="result">${getRank(score)}</p>
    <button class="btn" onclick="location.reload()">Play Again</button>
  `;
}

function getRank(score) {
  if (score === 10) return "🌟 Excellent! You're a genius!";
  if (score >= 7) return "👏 Great job!";
  if (score >= 5) return "🙂 Good effort!";
  return "😢 Better luck next time!";
}

loadQuestion();
</script>

</body>
</html>
